tions{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}.btn{border:1px solid #d8e4e8;background:#fff;color:var(--ink);padding:12px 22px;border-radius:9px;font-weight:700;font-size:13px}.btn:hover{transform:translateY(-1px);box-shadow:0 5px 18px #0002}.btn.secondary{background:#ffffff16;color:#fff;border-color:#ffffff99}.metrics{display:grid;grid-template-columns:repeat(4,1fr);background:white;border-bottom:1px solid var(--line)}.metric{padding:27px;border-right:1px solid var(--line)}.metric strong{display:block;font:24px Georgia,serif}.metric small{font-size:11px;color:var(--muted)}.section{padding:80px 0}.section.narrow{padding:45px 0}.secthead{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:30px}.secthead h2{font:normal clamp(35px,5vw,54px)/1.2 Georgia,serif;margin-top:7px}.secthead p{max-width:520px;font-size:14px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:.2s;cursor:pointer;text-align:left;box-shadow:0 4px 16px #153d4810}.card:hover{transform:translateY(-4px);box-shadow:0 15px 36px #13374618}.thumb{height:220px;position:relative;background:#cbdce2;overflow:hidden}.thumb img{height:100%;width:100%;object-fit:cover;display:block;transition:transform .4s}.card:hover img{transform:scale(1.035)}.chip{display:inline-block;background:#edf4f5;color:#55727e;border-radius:20px;padding:5px 10px;font-size:10px;font-weight:750;letter-spacing:.08em}.thumb .chip{position:absolute;top:15px;left:15px;background:#ffffffec;color:var(--ink)}.cbody{padding:22px}.cbody h3{font-size:19px;line-height:1.45;margin:9px 0}.cbody p{color:#70818a;font-size:13px;line-height:1.8}.cfoot{margin-top:16px;font-size:12px;color:#2f6375;font-weight:750}.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:28px}.homefeature{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center;background:white;border-radius:20px;overflow:hidden}.homefeature img{height:410px;width:100%;object-fit:cover}.homefeature>div{padding:40px}.homefeature h2{font:normal 42px Georgia,serif;margin:15px 0}.homefeature p{color:var(--muted)}.pageintro{background:#e9eff1;padding:58px 0;border-bottom:1px solid var(--line)}.pageintro h1{font:normal clamp(40px,6vw,65px) Georgia,serif;margin:8px 0}.pageintro p{color:var(--muted);max-width:750px;font-size:14px}.back{background:none;border:none;color:#4c7888;font-weight:650;font-size:13px;padding:0;cursor:pointer;margin-bottom:18px}.detail{padding:48px 0 90px}.detailtop{display:grid;grid-template-columns:1.1fr .9fr;gap:38px;align-items:start}.detailpic{height:440px;position:relative;border-radius:16px;overflow:hidden;background:#c3d3db;cursor:zoom-in}.detailpic img{width:100%;height:100%;object-fit:cover}.detailpic span{position:absolute;right:20px;bottom:18px;background:#ffffffdf;border-radius:30px;padding:8px 15px;font-size:12px}.detailtext h1{font:normal clamp(40px,5vw,60px)/1.2 Georgia,serif;margin:12px 0 21px}.detailtext p{color:#657985;font-size:15px;line-height:2}.pills{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.pills span{padding:6px 12px;background:#e4eef0;border-radius:20px;font-size:12px}.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:26px 0 38px}.gallery button{border:0;padding:0;background:none;height:150px;overflow:hidden;border-radius:10px;cursor:zoom-in}.gallery img{width:100%;height:100%;object-fit:cover}.infogrid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:22px}.info{background:white;border:1px solid var(--line);border-radius:14px;padding:26px}.info h3{font-size:19px;margin-bottom:15px}.info p,.info li{color:#5e7480;font-size:14px;line-height:1.95}.info ul{padding-left:22px;margin:0}.timeline{display:grid;gap:0}.timeitem{display:grid;grid-template-columns:115px 1fr;gap:15px;border-bottom:1px solid var(--line);padding:14px 0;font-size:14px}.timeitem strong{color:#255a6b}.timeitem:last-child{border:0}.callout{margin:20px 0;background:#edf4f4;border-radius:12px;padding:18px 22px;font-size:13px;color:#496674}.foot{border-top:1px solid var(--line);padding:35px 0;color:var(--muted);font-size:12px;text-align:center;background:#f8faf9}.loading{min-height:60vh;display:flex;justify-content:center;align-items:center;color:#6f8390}.lightbox{position:fixed;inset:0;background:#061520ee;z-index:100;display:none;align-items:center;justify-content:center;padding:25px}.lightbox.show{display:flex}.lightbox img{max-width:86vw;max-height:86vh;object-fit:contain}.lightbox button{position:absolute;border:0;border-radius:100px;background:#ffffffdf;width:44px;height:44px;font-size:22px;cursor:pointer}.lightbox .close{top:25px;right:25px}.lightbox .prev{left:18px}.lightbox .next{right:18px}.lightbox .count{position:absolute;bottom:18px;color:#f9fcfd;font-size:13px}.notice{font-size:12px;color:#6b8792;margin-top:15px}.error{background:#fff4ec;padding:30px;border-radius:14px;color:#8b4f2a}
@media(max-width:900px){.wrap{padding:0 20px}.top{height:auto;min-height:68px}.topin{min-height:68px;flex-wrap:wrap}.preview{display:none}.menu{display:block;background:none;border:0;font-size:26px;color:var(--ink)}.nav{width:100%;display:none;flex-direction:column;align-items:stretch;padding-bottom:14px}.nav.open{display:flex}.nav button{text-align:left;font-size:14px;padding:12px}.grid,.grid.four{grid-template-columns:repeat(2,minmax(0,1fr))}.detailtop{grid-template-columns:1fr}.homefeature{grid-template-columns:1fr}.homefeature img{height:300px}.homefeature>div{padding:25px}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.hero{min-height:540px}.hero h1{font-size:68px}.hero h2{font-size:22px}.hero p{font-size:13px}.metric{padding:20px}.metric strong{font-size:20px}.section{padding:52px 0}.secthead{display:block}.secthead p{margin-top:10px}.grid,.grid.four,.grid.two{grid-template-columns:1fr}.thumb{height:250px}.detailpic{height:310px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.gallery button{height:125px}.infogrid{grid-template-columns:1fr}.detail{padding-top:30px}.detailtext h1{font-size:36px}.timeitem{grid-template-columns:92px 1fr}.homefeature h2{font-size:34px}.pageintro{padding:40px 0}}

<body>
<header class="top"><div class="topin wrap"><a class="logo" href="#home">CHAMONIX.<span>WINTER JOURNAL — 2027</span></a><button class="menu" id="menu" aria-label="展开导航">☰</button><nav class="nav" id="nav"></nav><div class="preview">网站设计预览 · 未替换正式版</div></div></header>

<footer class="foot">CHAMONIX 2027 · 旅行网站设计预览<br>所有旅行资料供规划参考，出行前请复核官方开放时间。</footer>
<div class="lightbox" id="lightbox" aria-modal="true"><button class="close" aria-label="关闭">×</button><button class="prev" aria-label="上一张">‹</button><img id="large" alt="照片大图"><button class="next" aria-label="下一张">›</button><div class="count" id="count"></div></div>
<script>
(function(){
"use strict";
var DATA, app=document.getElementById("app"),nav=document.getElementById("nav"),gallery=[],gindex=0;
var pages=[["home","首页"],["itinerary","每日行程"],["hotels","酒店住宿"],["ski","滑雪体验"],["places","景点与体验"],["transport","交通攻略"]];
function esc(s){return String(s===undefined?"":s).replace(/[&<>"']/g,function(x){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]})}
function photo(k){var p=DATA.photos[k]||DATA.photos.hero;return p&&p.url||""}
function img(k,cls){return '<img class="'+(cls||'')+'" src="'+photo(k)+'" loading="lazy" alt="'+esc(k)+'">'}
function route(v){location.hash="#"+v}
function header(label,title,desc){return '<section class="pageintro"><div class="wrap"><div class="eyebrow">'+esc(label)+'</div><h1>'+esc(title)+'</h1><p>'+esc(desc||"")+'</p></div></section>'}
function section(label,title,body,extra){return '<section class="section wrap"><div class="secthead"><div><div class="eyebrow">'+esc(label)+'</div><h2>'+esc(title)+'</h2></div>'+(extra?'<p>'+esc(extra)+'</p>':'')+'</div>'+body+'</section>'}
function card(k,photoKey,title,summary,tag){return '<article class="card" data-route="'+esc(k)+'"><div class="thumb">'+img(photoKey)+'<span class="chip">'+esc(tag||"查看更多")+'</span></div><div class="cbody"><h3>'+esc(title)+'</h3><p>'+esc(summary)+'</p><div class="cfoot">查看详情 ↗</div></div></article>'}
function cards(a){return '<div class="grid">'+a.join("")+'</div>'}
function formatDay(d){return card("day-"+d.d,d.photos[0],"2月"+Number(d.d)+"日 · "+d.title,d.sub,d.category)}
function spotCard(a){return card("spot-"+a.k,a.images[0],a.title,a.desc,a.tag)}
function hotelCard(h){return card("hotel-"+h.id,h.images[0],h.name,h.tagline,h.label)}
function home(){
return '<section class="hero"><div class="heroimg" style="background-image:url(\''+photo("hero")+'\')"></div><div class="heroin wrap"><div class="eyebrow">FRANCE · HAUTE-SAVOIE · FEBRUARY 2027</div><h1>Chamonix.</h1><h2>在勃朗峰下，度过冬天</h2><p>七天阿尔卑斯雪山之旅。从红色齿轨小火车到蓝色冰洞，从雪场练习到山谷温泉，把旅程变成值得翻阅的冬日故事。</p><div class="actions"><button class="btn" data-route="itinerary">查看完整七日行程 ↗</button><button class="btn secondary" data-route="places">探索精彩体验 →</button></div></div></section>'+
'<div class="wrap metrics"><div class="metric"><strong>7 DAYS</strong><small>2027年2月6—12日</small></div><div class="metric"><strong>5 + 1 NIGHTS</strong><small>霞慕尼五晚 · 日内瓦一晚</small></div><div class="metric"><strong>2 SKI DAYS</strong><small>La Vormaine + Les Houches</small></div><div class="metric"><strong>3 HOTELS</strong><small>三家备选详细比较</small></div></div>'+
section("EXPLORE","打开你的冬季旅程",cards([card("itinerary","train","七日行程","按日期规划，每一天均可查看交通、顺序与提醒。","DAILY ROUTE"),card("hotels","aiglons_0","雪山酒店","三家酒店的景观、水疗和位置比较。","STAY"),card("ski","ski1","滑雪体验","两天不同雪区，按当前水平安排。","SKI"),card("places","midi","高山与冰川","南针峰、红色小火车与蓝冰洞。","DISCOVER"),card("places","qc","水疗与体验","QC Spa、狗拉雪橇和轨道过山车。","RELAX")]))+
'<section class="section wrap"><div class="homefeature">'+img("train_alt")+'<div><div class="eyebrow">THE JOURNEY</div><h2>雪山的记忆，<br>不只有滑雪。</h2><p>南针峰 3,842 米观景台、冰川内部的蓝色洞穴、历史悠久的红色齿轨列车，以及在雪山之间享受温暖水疗。</p><div class="actions"><button class="btn" data-route="places">浏览景点详情 →</button></div></div></div></section>'}
function itinerary(){return header("ITINERARY","每日行程","2月6日至11日详细日程，2月12日从日内瓦返程。点击每一天查看时间顺序、交通与注意事项。")+section("06—12 FEB","七日冬季旅行",cards(DATA.days.map(formatDay).concat([card("transport","town","2月12日 · 日内瓦返程","前往机场、搭乘返京航班。","RETURN")]))}
function hotels(){return header("STAY","酒店住宿","依据之前整理的酒店实拍和设施信息，查看三家住宿的优缺点、位置与水疗特色。")+section("HOTEL COLLECTION","三家酒店对比",cards(DATA.hotels.map(hotelCard)))}
function ski(){return header("SKI","滑雪体验","两日分别安排在 La Vormaine 与 Les Houches，重点选择适合练习转弯和稳控速度的区域。")+section("TWO SKI DAYS","两个雪区",cards(DATA.attractions.filter(function(a){return a.k==="ski1"||a.k==="ski2"}).map(spotCard)))}
function places(){return header("EXPERIENCES","景点与体验","南针峰、红色齿轨小火车、蓝冰洞、轨道过山车、雪橇犬体验和 QC Spa。")+section("EIGHT EXPERIENCES","不可错过的体验",cards(DATA.attractions.filter(function(a){return a.k!=="ski1"&&a.k!=="ski2"}).map(spotCard)))}
function transport(){return header("TRANSPORT","交通攻略","按你之前规划的日内瓦进出线路整理。具体接驳与开放时间出行前以官方为准。")+section("GETTING THERE","如何抵达与返程",'<div class="infogrid"><div class="info"><h3>✈ 2月6日 · 抵达日内瓦</h3><p>CA861 北京出发，计划 07:05 抵达日内瓦机场。入境取行李后乘预约接驳车前往霞慕尼。</p><p class="notice">航班信息按此前行程整理，不代表实时航班状态。</p></div><div class="info"><h3>🚐 日内瓦 ↔ 霞慕尼</h3><p>建议预订往返接驳。到霞慕尼后，市中心的红色小火车和南针峰缆车可按住宿位置步行到达；滑雪日搭乘山谷巴士。</p></div><div class="info"><h3>🏨 2月11日 · 日内瓦住宿</h3><p>上午在霞慕尼小镇闲逛，下午返回日内瓦并入住一晚，避免次日上午远距离赶飞机。</p></div><div class="info"><h3>✈ 2月12日 · 返程</h3><p>按此前预定计划：CA862 12:20 日内瓦起飞，次日抵达北京。请在出行前复核航班、机场航站楼以及接驳时间。</p></div></div>')}
function bullets(items){return '<ul>'+((items||[]).map(function(t){return '<li>'+esc(t)+'</li>'}).join(""))+'</ul>'}
function photoGrid(keys){return '<div class="gallery">'+keys.map(function(k,i){return '<button data-image="'+esc(k)+'" data-group="'+keys.join(",")+'" aria-label="查看照片 '+(i+1)+'">'+img(k)+'</button>'}).join("")+'</div>'}
function detailShell(label,title,subtitle,keys,tags,body,returnTo){
return '<div class="detail wrap"><button class="back" data-route="'+returnTo+'">← 返回'+(returnTo==="hotels"?"酒店列表":returnTo==="itinerary"?"每日行程":returnTo==="ski"?"滑雪体验":"景点列表")+'</button><div class="detailtop"><div class="detailpic" data-image="'+esc(keys[0])+'" data-group="'+keys.join(",")+'">'+img(keys[0])+'<span>点击放大照片 ↗</span></div><div class="detailtext"><div class="eyebrow">'+esc(label)+'</div><h1>'+esc(title)+'</h1><p>'+esc(subtitle)+'</p><div class="pills">'+tags.map(function(t){return '<span>'+esc(t)+'</span>'}).join("")+'</div></div></div>'+photoGrid(keys)+body+'</div>'}
function hotelDetail(id){var h=DATA.hotels.find(function(x){return x.id===id});if(!h)return home();var body='<div class="infogrid"><div class="info"><h3>酒店特点</h3>'+bullets(h.features)+'</div><div class="info"><h3>值得关注</h3>'+bullets(h.pros)+'</div><div class="info"><h3>水疗与景观</h3><p>'+esc(h.spa)+'</p><p>'+esc(h.view)+'</p></div><div class="info"><h3>位置与交通</h3><p>'+esc(h.transport)+'</p><p>'+esc(h.map)+'</p></div><div class="info"><h3>注意事项</h3>'+bullets(h.cons)+'</div><div class="info"><h3>查看酒店官网</h3><p>设施开放情况、房型和具体服务以酒店官网为准。</p><p><a target="_blank" rel="noopener" href="'+esc(h.url)+'">打开官方网站 ↗</a></p></div></div>';return detailShell(h.label,h.name,h.description,h.images,[h.tagline],body,"hotels")}
function spotDetail(k){var a=DATA.attractions.find(function(x){return x.k===k});if(!a)return places();var body='<div class="infogrid"><div class="info"><h3>体验介绍</h3><p>'+esc(a.intro||a.desc)+'</p></div><div class="info"><h3>推荐体验顺序</h3>'+bullets(a.experience)+'</div><div class="info"><h3>交通与时间</h3><p>'+esc(a.transit)+'</p><p>建议时长：'+esc(a.duration)+'</p></div><div class="info"><h3>实用提醒</h3><p>'+esc(a.tips)+'</p></div></div><div class="callout">开放、天气和预约要求请以景点官方公告为准。 <a href="'+esc(a.url)+'" target="_blank" rel="noopener">查看景点官网 ↗</a></div>';return detailShell(a.tag,a.title,a.desc,a.images,[a.duration,a.weather||""],body,k==="ski1"||k==="ski2"?"ski":"places")}
function dayDetail(d){var a=DATA.days.find(function(x){return x.d===d});if(!a)return itinerary();var body='<div class="infogrid"><div class="info"><h3>当天时间安排</h3><div class="timeline">'+a.schedule.map(function(x){return '<div class="timeitem"><strong>'+esc(x[0])+'</strong><span>'+esc(x[1])+'</span></div>'}).join("")+'</div></div><div class="info"><h3>交通与注意事项</h3><p>'+esc(a.travel)+'</p><div class="callout">'+esc(a.warning)+'</div><p><a target="_blank" rel="noopener" href="'+esc(a.url)+'">查看相关官方信息 ↗</a></p></div></div>';return detailShell("DAY "+(Number(d)-5)+" · 2027/02/"+d,a.title,a.sub,a.photos,[a.category,"2月"+Number(d)+"日",a.wd],body,"itinerary")}
function render(){if(!DATA)return;var r=decodeURIComponent(location.hash.slice(1)||"home"),p=r.split("-");var html=r==="home"?home():r==="itinerary"?itinerary():r==="hotels"?hotels():r==="ski"?ski():r==="places"?places():r==="transport"?transport():p[0]==="hotel"?hotelDetail(p.slice(1).join("-")):p[0]==="spot"?spotDetail(p.slice(1).join("-")):p[0]==="day"?dayDetail(p[1]):home();app.innerHTML=html;nav.innerHTML=pages.map(function(i){return '<button data-route="'+i[0]+'" class="'+(r===i[0]||r.startsWith(i[0]+"-")?"active":"")+'">'+i[1]+'</button>'}).join("");document.getElementById("nav").classList.remove("open");window.scrollTo(0,0)}
function show(keys,index){gallery=keys;gindex=Math.max(0,index);document.getElementById("lightbox").classList.add("show");document.body.style.overflow="hidden";showCurrent()}
function showCurrent(){document.getElementById("large").src=photo(gallery[gindex]);document.getElementById("count").textContent=(gindex+1)+" / "+gallery.length}
function close(){document.getElementById("lightbox").classList.remove("show");document.body.style.overflow="";document.getElementById("large").src=""}
document.addEventListener("click",function(e){var routeEl=e.target.closest("[data-route]");if(routeEl){route(routeEl.dataset.route);return}var imageEl=e.target.closest("[data-image]");if(imageEl){var keys=(imageEl.dataset.group||imageEl.dataset.image).split(",");show(keys,keys.indexOf(imageEl.dataset.image));return}if(e.target.classList.contains("close"))close();if(e.target.classList.contains("prev")){gindex=(gindex+gallery.length-1)%gallery.length;showCurrent()}if(e.target.classList.contains("next")){gindex=(gindex+1)%gallery.length;showCurrent()}if(e.target.id==="lightbox")close()});
document.getElementById("menu").addEventListener("click",function(){nav.classList.toggle("open")});
document.addEventListener("keydown",function(e){if(!document.getElementById("lightbox").classList.contains("show"))return;if(e.key==="Escape")close();if(e.key==="ArrowLeft"){gindex=(gindex+gallery.length-1)%gallery.length;showCurrent()}if(e.key==="ArrowRight"){gindex=(gindex+1)%gallery.length;showCurrent()}});
window.addEventListener("hashchange",render);
fetch("../index.html",{cache:"no-store"}).then(function(r){if(!r.ok)throw Error("HTTP "+r.status);return r.text()}).then(function(source){var m=source.match(/const DATA=(\{[\s\S]*?\});\s*\n/);if(!m)throw Error("原站资料未找到");DATA=JSON.parse(m[1]);render()}).catch(function(e){app.innerHTML='<div class="wrap section"><div class="error"><h2>预览暂时加载失败</h2><p>未能读取原网站的照片和行程内容：'+esc(e.message)+'</p><p>请稍后刷新页面。</p></div></div>';console.error(e)});
})();
</script></body></html>
