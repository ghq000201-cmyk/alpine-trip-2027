  </nav><div class="header-right"><span class="date-mark">FRANCE · 06–12 FEB 2027</span><button class="menu-toggle" id="mobileMenu" aria-label="打开菜单" aria-expanded="false">☰</button></div>
</div></header>
<main id="app" aria-live="polite"></main>
<footer class="site-footer"><div class="container"><div class="footer-inner"><div><div class="footer-brand">CHAMONIX.</div><p style="font-size:13px;color:#a9bec4;max-width:400px">在勃朗峰的冬天，留一周给雪、山和温泉。<br>2027 年 2 月 6 日—12 日 · 私人旅行指南</p></div><div class="footer-links"><a href="#/home">首页</a><a href="#/itinerary">每日行程</a><a href="#/hotels">酒店</a><a href="#/ski">滑雪</a><a href="#/experiences">景点</a><a href="#/transport">交通</a></div></div><div class="footer-note">全部照片沿用此前提供并整理到旅行网站中的图片；部分景色为区域参考照片，不代表指定景点或雪道的实时现场状态。运营时间、预订规则、班次与航班以出行前官方信息和实际订单为准。本预览网站不含照片编辑、上传及在线预订功能。网页可离线浏览。</div></div></footer>

<script>
const DATA=JSON.parse(window.CHAMONIX_DATA_PARTS.join('')); window.CHAMONIX_DATA_PARTS=null;
const $=s=>document.querySelector(s);
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const img=k=>(DATA.photos[k]||DATA.photos.hero).url;
const attribution=k=>(DATA.photos[k]||{}).credit||'此前提供的旅行图片';
const itemImage=(k,alt='',loading='lazy')=>`<img loading="${loading}" src="${img(k)}" alt="${h(alt||attribution(k))}">`;
const deepLink=(type,id)=>`#/${type}/${encodeURIComponent(id)}`;
const galleryBtn=(k,keys,cl='',alt='',extras='')=>`<button class="${cl}" type="button" data-gallery="${keys.join('|')}" data-photo="${k}" aria-label="放大查看 ${h(alt||'照片')}" ${extras}>${itemImage(k,alt)}</button>`;
const pill=(s)=>`<span class="chip">${h(s)}</span>`;
function heroSub(title,sub,photo){return `<div class="page-hero">${itemImage(photo,'', 'eager')}<div class="container"><div class="mono" style="color:#c6d4d7">CHAMONIX · WINTER 2027</div><h1>${h(title)}</h1><p>${h(sub)}</p></div></div>`;}
function pageHeader(section,secLink,title,subtitle){return `<div class="container"><div class="breadcrumb"><a href="#/home">首页</a><span> / </span><a href="${secLink}">${h(section)}</a><span> / </span>${h(title)}</div><div class="detail-head"><div><div class="eyebrow">CHAMONIX · TRAVEL GUIDE</div><h1>${h(title)}</h1>${subtitle?`<p>${h(subtitle)}</p>`:''}</div><a class="btn btn-soft" href="${secLink}">← 返回${h(section)}</a></div></div>`}
function siteEnd(){return `<div class="end-banner"><p>SEE YOU IN THE ALPS</p><h2>See you in Chamonix.</h2><p>好风景，值得慢慢走。</p></div>`}
function card(photo,eyebrow,title,desc,url){return `<a class="photo-card" href="${url}"><div class="photo-card-image">${itemImage(photo,title)}</div><div class="photo-card-body"><div class="card-label">${h(eyebrow)}</div><h3>${h(title)}</h3><p>${h(desc)}</p><span class="arrow" aria-hidden="true">↗</span></div></a>`}
function gallery(keys){if(!keys?.length)return '';let k=keys.filter(x=>DATA.photos[x]);if(!k.length)return '';if(k.length===2)return `<div class="detail-gallery two-image-gallery">${k.map(v=>galleryBtn(v,k,'gallery-item','雪场照片')).join('')}</div><div class="photo-note">点击照片放大浏览 · 共 2 张实景照片</div>`;return `<div class="detail-gallery">${k.slice(0,3).map((v,i)=>galleryBtn(v,k,'gallery-item','旅行照片',i===2?`title="点击查看全部 ${k.length} 张"`:'' )).join('')}</div><div class="gallery-thumbs">${k.map((v,i)=>galleryBtn(v,k,'','照片 '+(i+1))).join('')}</div><div class="photo-note">点击照片可放大查看、左右切换 · 当前相册共 ${k.length} 张</div>`;}
function home(){return `<div class="hero">${itemImage('hero','南针峰冬季雪山', 'eager')}<div class="container hero-content"><div class="pretitle">FRANCE · HAUTE-SAVOIE · FEBRUARY 2027</div><h1>Chamonix.</h1><h2>在勃朗峰下，度过冬天</h2><p>一趟为雪山而来的旅行。走进南针峰的冰雪世界，乘红色小火车去看蓝冰洞，在两天滑雪之后，把傍晚留给热腾腾的雪山水疗。</p><div class="hero-links"><a class="btn btn-light" href="#/itinerary">查看完整七日行程 <span>↗</span></a><a class="btn btn-line" href="#/experiences">探索精彩体验 →</a></div></div><div class="hero-side">THE JOURNEY <b>06—12 FEB</b>SEVEN DAYS IN THE ALPS</div></div>
<div class="stats"><div class="container stats-inner"><div class="stat"><b>7 DAYS</b><small>2027 年 2 月 6—12 日</small></div><div class="stat"><b>5 + 1 NIGHTS</b><small>霞慕尼五晚 · 日内瓦一晚</small></div><div class="stat"><b>2 SKI DAYS</b><small>2 月 8—9 日 · 双雪区</small></div><div class="stat"><b>3 HOTELS</b><small>精挑细选 · 深入比较</small></div></div></div>
<section class="section"><div class="container"><div class="section-title"><div><div class="eyebrow">THE JOURNEY</div><h2>把冬天交给阿尔卑斯</h2><p>不是赶景点，而是让每一天有自己的节奏：高山观景、蓝色冰洞、滑雪，以及一场雪山旁的放松。</p></div><a class="text-link" href="#/itinerary">查看每日行程 ↗</a></div><div class="card-grid">${card('midi','01 / THE MOUNTAIN','南针峰 · 3,842m','走上云端观景平台，收藏勃朗峰冬季最震撼的画面。',deepLink('spot','midi'))}${card('train_third','02 / THE GLACIER','红色小火车 · 蓝冰洞','坐复古登山列车穿越山林，走进冰川内部的蓝色世界。',deepLink('spot','train'))}${card('qc_alt','03 / SLOW DOWN','雪山水疗 · QC Spa','滑雪后在露天热水池看山，缓慢度过一个傍晚。',deepLink('spot','qc'))}</div></div></section>
<section class="section section-soft"><div class="container editorial"><div class="editorial-image">${itemImage('ski2_alt','霞慕尼的雪山风景')}</div><div class="editorial-text"><div class="eyebrow">SKI EXPERIENCE</div><h2>两天滑雪，<br>两种山谷风景。</h2><p>第一天，在 La Vormaine 的绿道找回转弯节奏；第二天，视状态前往 Les Houches 的山林雪道。我们以安全、轻松和景色为优先，不必为了挑战难度而赶路。</p><div class="chips">${pill('La Vormaine · 2月8日')}${pill('Les Houches · 2月9日')}${pill('由易到难')}</div><a class="btn btn-dark" href="#/ski">查看两大滑雪场 ↗</a></div></div></section>
<section class="section"><div class="container"><div class="section-title"><div><div class="eyebrow">WHERE TO STAY</div><h2>在雪山里，住得舒服一点</h2><p>三家不同气质的酒店，按泳池、桑拿、客房景观和交通位置对比。</p></div><a class="text-link" href="#/hotels">查看酒店对比 ↗</a></div><div class="card-grid">${DATA.hotels.map(x=>card(x.images[0],x.label,x.short,x.tagline,deepLink('hotel',x.id))).join('')}</div></div></section>
<section class="section section-cream"><div class="container"><div class="section-title"><div><div class="eyebrow">PHOTO STORIES</div><h2>之前珍藏的旅行照片</h2><p>沿用此前提供的真实照片，不替换成 AI 示意图；点击任一张可放大浏览。</p></div></div><div class="gallery-strip">${['train','cave','dog','qc'].map(k=>galleryBtn(k,['train','cave','dog','qc'],'', '旅行照片')).join('')}</div><div class="photo-note">照片来自你此前提供的旅行资料，其中一些为旅行参考实拍、并非指定场地当天的照片。</div></div></section>${siteEnd()}`}
function itinerary(){let intro=heroSub('七日行程','2 月 6—7 日观光，8—9 日滑雪，10 日雪橇与水疗，11 日返回日内瓦，12 日飞北京。','train_alt');return `${intro}<section class="section compact"><div class="container"><div class="section-title"><div><div class="eyebrow">DAY BY DAY</div><h2>每天都有独立的故事</h2><p>点击日期查看当日时刻表、交通、图片和需要注意的事项。上午不用刻意安排得过早。</p></div></div><div class="itinerary-layout"><aside class="day-nav"><h3>SELECT A DAY</h3>${DATA.days.map(d=>`<a class="day-link" href="${deepLink('day',d.d)}"><b>${d.d}</b><span>2 月 ${d.d} 日<br>${h(d.title)}</span></a>`).join('')}</aside><div>${DATA.days.map((d,i)=>`<a class="photo-card" style="display:grid;grid-template-columns:${d.photos.length?'minmax(150px,.45fr) 1fr':'1fr'};margin-bottom:14px;min-height:${d.photos.length?'160px':'112px'}" href="${deepLink('day',d.d)}">${d.photos.length?`<div class="photo-card-image" style="height:100%;min-height:160px">${itemImage(d.photos[0],d.title)}</div>`:''}<div class="photo-card-body" style="padding:19px 23px"><span class="card-label">FEB ${d.d} · ${h(d.wd)} · ${h(d.category)}</span><h3 style="font-size:19px;margin:6px 0">${h(d.title)}</h3><p>${h(d.sub)}</p><span style="color:#567e87;font-weight:700;font-size:12px">打开当天行程 ↗</span></div></a>`).join('')}</div></div><div class="notice"><strong>☁ 天气弹性：</strong>第一天南针峰受航班、山顶风速及缆车运营影响。若无法在下午较早时段到站，优先与 7 日冰川路线调换，避免勉强赶路。其他时间同样要根据 2027 年实际开放情况调整。</div></div></section>`}
function dayPage(d){if(!d)return notfound();let keys=d.photos.filter(k=>DATA.photos[k]);return `${pageHeader('每日行程','#/itinerary',`2 月 ${d.d} 日 · ${d.title}`,d.sub)}<section class="section compact" style="padding-top:10px"><div class="container itinerary-layout"><aside class="day-nav"><h3>SELECT A DAY</h3>${DATA.days.map(x=>`<a class="day-link ${x.d===d.d?'active':''}" href="${deepLink('day',x.d)}"><b>${x.d}</b><span>2月${x.d}日<br>${h(x.title)}</span></a>`).join('')}</aside><article class="day-content"><div class="eyebrow">FEBRUARY ${d.d}, 2027 · ${h(d.wd)}</div><h2 class="day-title" style="margin-top:16px">${h(d.title)}</h2><div class="chips">${pill(d.category)}${pill(d.sub)}</div>${keys.length?`<div class="day-photos ${keys.length===2?'two-photo-day':keys.length===1?'one-photo-day':''}">${keys.slice(0,3).map(k=>galleryBtn(k,keys,'','当日行程照片')).join('')}</div>`:''}${d.d==='11'?`<div class="day-geneva-panel"><div class="eyebrow">YOUR STAY · FEB 11—12</div><h3>NH Geneva Airport Hotel</h3><p>2027 年 2 月 11 日入住 · 12 日退房（1 晚）</p><p>地址：Avenue de Mategnin 21, 1217 Meyrin, Switzerland</p><a href="https://www.google.com/maps/search/?api=1&query=NH%20Geneva%20Airport%20Hotel%20Meyrin" target="_blank" rel="noopener noreferrer">查看酒店位置 ↗</a></div>`:''}<h3 style="font-size:20px;margin:23px 0 19px">今日时间安排</h3><div class="timeline">${d.schedule.map(a=>`<div class="timeline-row"><div class="time">${h(a[0])}</div><div class="dot"></div><div class="event">${h(a[1])}</div></div>`).join('')}</div><h3>如何前往</h3><p class="muted" style="font-size:13px;line-height:2">${h(d.travel)}</p><div class="notice"><strong>当天提醒：</strong>${h(d.warning)}</div><div style="display:flex;flex-wrap:wrap;gap:11px;margin-top:24px"><a class="btn btn-dark" target="_blank" rel="noopener noreferrer" href="${h(d.url)}">查看相关官方信息 ↗</a><a class="btn btn-soft" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(d.map)}">在地图查看位置 ↗</a></div><div style="display:flex;justify-content:space-between;margin-top:42px;border-top:1px solid #e4eaea;padding-top:20px">${DATA.days.indexOf(d)>0?`<a class="text-link" href="${deepLink('day',DATA.days[DATA.days.indexOf(d)-1].d)}">← 前一天</a>`:'<span></span>'}${DATA.days.indexOf(d)<DATA.days.length-1?`<a class="text-link" href="${deepLink('day',DATA.days[DATA.days.indexOf(d)+1].d)}">后一天 →</a>`:'<span></span>'}</div></article></div></section>`}
function genevaHotelSection(){return `<section class="section section-cream"><div class="container"><div class="section-title"><div><div class="eyebrow">GENEVA · 11—12 FEB</div><h2>返程前一晚 · NH 日内瓦机场酒店</h2><p>2 月 11 日入住，2 月 12 日退房；与霞慕尼三家住宿备选分开展示。</p></div></div><div class="geneva-stay"><div class="geneva-stay-photo">${galleryBtn('nh_geneva_room',['nh_geneva_room'],'','NH 日内瓦机场酒店客房')}</div><div class="geneva-stay-text"><span class="card-label">SWITZERLAND · MEYRIN</span><h3>NH Geneva Airport Hotel</h3><p>位于日内瓦机场附近的 Meyrin，适合作为 2 月 12 日返京航班前一晚的住宿安排。</p><div class="geneva-meta"><div><small>入住 / 退房</small><strong>2027年2月11日 — 2月12日（1晚）</strong></div><div><small>地址</small><strong>Avenue de Mategnin 21, 1217 Meyrin, Switzerland</strong></div><div><small>次日航班</small><strong>CA862 · 日内瓦 12:20 起飞（以机票为准）</strong></div></div><p style="font-size:12px;color:#86969c">房间照片来自你提供的酒店截图，仅用于住宿介绍，具体房型以订单为准。</p><a class="btn btn-dark" href="https://www.google.com/maps/search/?api=1&query=NH%20Geneva%20Airport%20Hotel%20Meyrin" target="_blank" rel="noopener noreferrer">查看酒店位置 ↗</a></div></div></div></section>`;}
function hotels(){return `${heroSub('住进雪山脚下','三家酒店，三种度假气质：室外恒温泳池、法式木屋山景，以及更完整的室内水疗。','aiglons_0')}<section class="section"><div class="container"><div class="section-title"><div><div class="eyebrow">STAY IN CHAMONIX</div><h2>你会喜欢哪一家？</h2><p>以下照片均来自此前提供的酒店图片。点击酒店卡片查看全部五张照片、设施、优缺点和交通位置。</p></div></div><div class="card-grid">${DATA.hotels.map(x=>card(x.images[0],x.label,x.short,x.description,deepLink('hotel',x.id))).join('')}</div></div></section>${genevaHotelSection()}<section class="section section-soft"><div class="container"><div class="section-title"><div><div class="eyebrow">SIDE BY SIDE</div><h2>三家酒店一眼对比</h2></div></div><div class="compare-wrap"><table class="comparison"><thead><tr><th>比较项目</th><th>Les Aiglons</th><th>Le Prieuré</th><th>Lykke</th></tr></thead><tbody><tr><td>风格</td><td>现代度假</td><td>阿尔卑斯木屋</td><td>北欧现代风</td></tr><tr><td>泳池</td><td>室外加热泳池</td><td>室内小水池</td><td>15 米室内泳池</td></tr><tr><td>水疗</td><td>室外 Jacuzzi、桑拿</td><td>Jacuzzi、室外桑拿</td><td>室内外 Jacuzzi、桑拿</td></tr><tr><td>交通</td><td>靠近 Chamonix Sud</td><td>靠近南针峰缆车</td><td>靠近火车站与红色小火车</td></tr><tr><td>推荐理由</td><td>雪山户外泡水</td><td>山景阳台与木屋氛围</td><td>水疗空间与位置</td></tr></tbody></table></div><div class="photo-note">入住与使用 SPA 的具体规则、早餐、山景房型、冬季泳池运营须在预订前向酒店确认。</div></div></section>`}
function hotelPage(x){if(!x)return notfound();return `${pageHeader('酒店住宿','#/hotels',x.name,x.tagline)}<div class="container">${gallery(x.images)}<div class="detail-cols"><article><div class="eyebrow">${h(x.label)}</div><h2 style="margin-top:16px">酒店介绍</h2><p>${h(x.description)}</p><h3>主要设施</h3><div class="chips">${x.features.map(pill).join('')}</div><h3>为什么值得选择</h3><ul>${x.pros.map(t=>`<li>${h(t)}</li>`).join('')}</ul><h3>预订前需要注意</h3><ul>${x.cons.map(t=>`<li>${h(t)}</li>`).join('')}</ul><div class="notice">每家酒店泳池与 SPA 开放时间、预约限制、房型权益可能不同。请以酒店预订页面及实际订单为准。</div></article><aside class="info-panel"><h3>酒店信息</h3><div class="info-row"><small>泳池与 SPA</small><strong>${h(x.spa)}</strong></div><div class="info-row"><small>房间景观</small><strong>${h(x.view)}</strong></div><div class="info-row"><small>交通位置</small><strong>${h(x.transport)}</strong></div><div style="display:flex;flex-direction:column;gap:11px;margin-top:22px"><a href="${h(x.url)}" target="_blank" rel="noopener noreferrer" class="btn btn-dark">访问酒店官网 ↗</a><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(x.map)}" target="_blank" rel="noopener noreferrer" class="btn btn-soft">查看地图位置 ↗</a></div></aside></div></div><section class="section section-soft compact"><div class="container"><div class="section-title"><div><div class="eyebrow">MORE TO EXPLORE</div><h2>再看看其他酒店</h2></div></div><div class="card-grid">${DATA.hotels.filter(y=>y.id!==x.id).map(y=>card(y.images[0],y.label,y.short,y.tagline,deepLink('hotel',y.id))).join('')}</div></div></section>`}
const skiFeatures=[{id:'ski1',n:'第一天',d:'02 / 08',label:'适合恢复技术',caption:'La Vormaine · Le Tour',photo:'ski1',chips:['三条绿道','一条蓝道','初级练习'],desc:'在山脚的温和坡度反复练习。先找回刹车、转弯和控速，再根据状态尝试蓝道。'},{id:'ski2',n:'第二天',d:'02 / 09',label:'视状态挑战',caption:'Les Houches · Prarion',photo:'ski2',chips:['山林雪景','较长雪道','需选简单路线'],desc:'想要更丰富的雪道与森林景观，可以去 Les Houches。避开红黑道，必要时乘缆车下山。'}];
function ski(){return `${heroSub('两天，两个雪场','根据目前以犁式转弯为主、蓝道基本能滑的水平，从轻松练习到更丰富的山林雪道。','ski1')}<section class="section"><div class="container"><div class="section-title"><div><div class="eyebrow">SKI AREAS</div><h2>先把滑雪滑得舒服</h2><p>第一天重点恢复手感，第二天再决定是否升级雪区。不强求挑战更陡的雪道。</p></div></div><div class="card-grid" style="grid-template-columns:repeat(auto-fit,minmax(290px,1fr))">${skiFeatures.map(f=>`<a class="photo-card" href="${deepLink('spot',f.id)}"><div class="photo-card-image" style="height:310px">${itemImage(f.photo,f.caption)}</div><div class="photo-card-body"><span class="card-label">DAY ${f.n==='第一天'?'01':'02'} · ${f.d} · ${f.label}</span><h3 style="font-size:25px">${f.caption}</h3><p>${f.desc}</p><div class="chips" style="margin-top:15px">${f.chips.map(pill).join('')}</div><span class="arrow">↗</span></div></a>`).join('')}</div><div class="photo-note">两组照片均来自你本次提供的雪场截图。点击每个雪场，可查看对应的两张照片及滑雪建议。</div></div></section><section class="section section-soft"><div class="container"><div class="section-title"><div><div class="eyebrow">COMPARISON</div><h2>哪一天去哪里？</h2></div></div><div class="compare-wrap"><table class="comparison"><thead><tr><th>比较维度</th><th>La Vormaine</th><th>Les Houches</th></tr></thead><tbody><tr><td>最适合</td><td>第一天熟悉雪板与转弯</td><td>第二天体验更多样路线</td></tr><tr><td>雪道规模</td><td>3 条绿道 + 1 条蓝道</td><td>约 55 公里不同难度雪道</td></tr><tr><td>核心优势</td><td>路线简单，练习效率高</td><td>森林景色、路线丰富</td></tr><tr><td>注意事项</td><td>拖牵索道需要适应</td><td>避免陡坡与 Kandahar 高难赛道</td></tr><tr><td>出发方向</td><td>霞慕尼山谷北端 Le Tour</td><td>霞慕尼山谷南端 Prarion</td></tr></tbody></table></div><div class="notice"><strong>安全提醒：</strong>以当天雪况和实际滑行水平决定路线。若第一天还不熟练，可以连续两天留在 La Vormaine；不存在必须完成两个不同雪场的要求。</div></div></section>`}
function experiences(){const order=['midi','train','cave','coaster','dog','qc'];let spots=order.map(id=>DATA.attractions.find(x=>x.k===id));return `${heroSub('雪山之上的每个瞬间','从南针峰玻璃观景台到红色齿轨列车，从蓝冰洞到狗拉雪橇和温泉。点击卡片进入完整详情。','midi')}<section class="section"><div class="container"><div class="section-title"><div><div class="eyebrow">THE EXPERIENCES</div><h2>六项值得慢慢体验的事</h2><p>照片、交通、玩法、建议时长与天气提醒都在详情页。滑雪的两项独立放在「滑雪体验」。</p></div></div><div class="card-grid">${spots.map(x=>card(x.images[0],x.tag,x.title,x.desc,deepLink('spot',x.k))).join('')}</div></div></section>`}
function spotPage(x){if(!x)return notfound();let weather=x.weather||'以现场运行情况为准';return `${pageHeader(x.k==='ski1'||x.k==='ski2'?'滑雪体验':'景点与体验',x.k==='ski1'||x.k==='ski2'?'#/ski':'#/experiences',x.title,x.en)}<div class="container">${gallery(x.images)}<div class="detail-cols"><article><div class="eyebrow">${h(x.tag)} · ${h(x.duration)}</div><h2 style="margin-top:16px">值得体验的理由</h2><p>${h(x.intro)}</p><h3>怎样玩比较合适</h3><ul>${x.experience.map(v=>`<li>${h(v)}</li>`).join('')}</ul><h3>实用建议</h3><p>${h(x.tips)}</p><div class="notice"><strong>天气与运营：</strong>${h(weather)}。具体开放时间、路况、当日缆车及项目运行需出发前核实。</div></article><aside class="info-panel"><h3>体验信息</h3><div class="info-row"><small>参考时长</small><strong>${h(x.duration)}</strong></div><div class="info-row"><small>交通方式</small><strong>${h(x.transit)}</strong></div><div class="info-row"><small>天气影响</small><strong>${h(weather)}</strong></div><div style="display:flex;flex-direction:column;gap:11px;margin-top:22px"><a href="${h(x.url)}" target="_blank" rel="noopener noreferrer" class="btn btn-dark">查看官方项目资料 ↗</a><a href="#/itinerary" class="btn btn-soft">返回七日行程 ↗</a></div></aside></div></div><section class="section section-soft compact"><div class="container"><div class="section-title"><div><div class="eyebrow">KEEP EXPLORING</div><h2>再看看其他体验</h2></div></div><div class="card-grid">${['midi','train','cave','coaster','dog','qc'].filter(k=>k!==x.k).slice(0,3).map(k=>{let y=DATA.attractions.find(z=>z.k===k);return card(y.images[0],y.tag,y.title,y.desc,deepLink('spot',k))}).join('')}</div></div></section>`}
const checks=['核对 CA861 / CA862 航班及行李规则','确认霞慕尼 2月6–11日酒店与 NH 日内瓦机场酒店（2月11–12日）','预订日内瓦机场与霞慕尼之间的接驳','核对南针峰缆车时段、天气和改期条件','确认 Montenvers 小火车和蓝冰洞开放情况','预订两天滑雪的雪票、雪具或课程','确认狗拉雪橇具体场地、场次和双人安排','预订 2 月10日 QC Spa 入场时段'];
function transport(){return `${heroSub('路线与出发准备','从日内瓦到霞慕尼，如何串起镇中心、两大雪区和山上的经典景点。','train_third')}<section class="section"><div class="container"><div class="section-title"><div><div class="eyebrow">GETTING THERE</div><h2>四段路线，串起一周</h2><p>将跨境接驳、高山观光、滑雪交通和返程分开，减少临时反复查路线。</p></div></div><div class="route-steps"><div class="route-step"><div class="number">01</div><h3>日内瓦机场 → 霞慕尼</h3><p>2 月 6 日航班抵达后乘预约跨境接驳。先到酒店寄存行李，再根据天气决定是否去南针峰。</p></div><div class="route-step"><div class="number">02</div><h3>霞慕尼镇中心观光</h3><p>南针峰、Montenvers 红色小火车、Les Planards 与 QC Spa 主要在镇内，步行和短途巴士组合。</p></div><div class="route-step"><div class="number">03</div><h3>前往两大雪区</h3><p>La Vormaine 在北端 Le Tour；Les Houches 在南端 Prarion。两个雪区需要分别坐巴士，不可相互滑行到达。</p></div><div class="route-step"><div class="number">04</div><h3>霞慕尼 → 日内瓦 → 北京</h3><p>2 月 11 日入住 NH Geneva Airport Hotel（Avenue de Mategnin 21, 1217 Meyrin），12 日退房后前往日内瓦机场，搭乘返京航班。</p></div></div><div style="margin-top:35px;display:flex;flex-wrap:wrap;gap:12px"><a class="btn btn-dark" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&query=Chamonix+France">在地图查看霞慕尼 ↗</a><a class="btn btn-soft" href="#/itinerary">回到详细行程 ↗</a></div><div class="notice"><strong>狗拉雪橇交通要单独确认：</strong>此前查询到的 Huskydalen 可能涉及 Les Molliets / Les Carroz 集合点，并非一定在霞慕尼镇内。未得到最终地点前，不要按镇内步行规划当天交通。</div></div></section><section class="section section-soft"><div class="container"><div class="section-title"><div><div class="eyebrow">BEFORE DEPARTURE</div><h2>出发前，别忘记这几件事</h2><p>可点击勾选。记录仅保存在当前浏览器中，不会提交或上传任何信息。</p></div><button type="button" class="btn btn-soft" id="clearChecks">清除勾选</button></div><div class="checklist">${checks.map((t,i)=>`<label class="check-item"><input type="checkbox" data-check="${i}" aria-label="${h(t)}"><span>${h(t)}</span></label>`).join('')}</div></div></section>`}
function notfound(){return `${heroSub('页面暂未找到','请选择导航栏中的其他栏目，继续查看霞慕尼旅行内容。','hero')}<section class="section"><div class="container"><a class="btn btn-dark" href="#/home">返回首页 ↗</a></div></section>`}
function navName(route){let a=route[0];return ({home:'home',itinerary:'itinerary',day:'itinerary',hotels:'hotels',hotel:'hotels',ski:'ski',experiences:'experiences',spot:'experiences',transport:'transport'})[a]||'home'}
function render(){let hash=(location.hash||'#/home').replace(/^#\/?/,'');let route=hash.split('/').filter(Boolean),page=route[0]||'home',id=decodeURIComponent(route[1]||'');let view;
 switch(page){case 'home':view=home();break;case 'itinerary':view=itinerary();break;case 'day':view=dayPage(DATA.days.find(x=>x.d===id));break;case 'hotels':view=hotels();break;case 'hotel':view=hotelPage(DATA.hotels.find(x=>x.id===id));break;case 'ski':view=ski();break;case 'experiences':view=experiences();break;case 'spot':view=spotPage(DATA.attractions.find(x=>x.k===id));break;case 'transport':view=transport();break;default:view=notfound()}
 $('#app').innerHTML=view;let selected=navName(route);if(page==='spot'&&(id==='ski1'||id==='ski2'))selected='ski'; document.querySelectorAll('[data-nav]').forEach(n=>{n.classList.toggle('active',n.dataset.nav===selected);if(n.dataset.nav===selected)n.setAttribute('aria-current','page');else n.removeAttribute('aria-current')});$('#topNav').classList.remove('is-open');$('#mobileMenu').setAttribute('aria-expanded','false');$('#mobileMenu').textContent='☰';document.title=(page==='home'?'CHAMONIX 2027':$('#app h1')?.textContent||'霞慕尼')+' · 雪山旅行指南'; if(page==='transport')initChecks();window.scrollTo(0,0);}
let currentLightboxKeys=[],currentLightboxIndex=0;
function showLightbox(){let key=currentLightboxKeys[currentLightboxIndex];$('#lightboxImage').src=img(key);$('#lightboxImage').alt=attribution(key);$('#lightboxCaption').textContent=({'midipeak':'南针峰雪山','train_third':'Montenvers 红色齿轨列车','cave':'蓝冰洞','qc_alt':'冬季雪山水疗','dog':'狗拉雪橇'})[key]||'霞慕尼旅行照片';$('#lightboxCounter').textContent=`${currentLightboxIndex+1} / ${currentLightboxKeys.length}`;$('#lightboxCredit').textContent=attribution(key);}
function closeLightbox(){$('#lightbox').classList.remove('open');document.body.classList.remove('modal-open')}
function shiftLightbox(n){currentLightboxIndex=(currentLightboxIndex+n+currentLightboxKeys.length)%currentLightboxKeys.length;showLightbox()}
function initChecks(){let marked=[];try{marked=JSON.parse(localStorage.getItem('chamonix2027-checks')||'[]')}catch(e){}document.querySelectorAll('[data-check]').forEach(c=>{c.checked=marked.includes(Number(c.dataset.check));c.addEventListener('change',saveChecks)});$('#clearChecks')?.addEventListener('click',()=>{document.querySelectorAll('[data-check]').forEach(c=>c.checked=false);saveChecks()})}
function saveChecks(){try{localStorage.setItem('chamonix2027-checks',JSON.stringify(Array.from(document.querySelectorAll('[data-check]:checked')).map(x=>Number(x.dataset.check))))}catch(e){}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-gallery]');if(el){let keys=el.dataset.gallery.split('|').filter(k=>DATA.photos[k]);if(keys.length){currentLightboxKeys=keys;currentLightboxIndex=Math.max(0,keys.indexOf(el.dataset.photo));$('#lightbox').classList.add('open');document.body.classList.add('modal-open');showLightbox();}return}const lb=e.target.closest('[data-lightbox]');if(lb){if(lb.dataset.lightbox==='close')closeLightbox();if(lb.dataset.lightbox==='prev')shiftLightbox(-1);if(lb.dataset.lightbox==='next')shiftLightbox(1)}});
$('#lightbox').addEventListener('click',e=>{if(e.target.id==='lightbox')closeLightbox()});document.addEventListener('keydown',e=>{if(!$('#lightbox').classList.contains('open'))return;if(e.key==='Escape')closeLightbox();else if(e.key==='ArrowLeft')shiftLightbox(-1);else if(e.key==='ArrowRight')shiftLightbox(1)});
$('#mobileMenu').addEventListener('click',()=>{let nav=$('#topNav');let open=nav.classList.toggle('is-open');$('#mobileMenu').setAttribute('aria-expanded',String(open));$('#mobileMenu').textContent=open?'×':'☰'});
$('#backTop').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));window.addEventListener('scroll',()=>$('#backTop').classList.toggle('shown',window.scrollY>600));window.addEventListener('hashchange',render);render();
</script>
</body></html>
